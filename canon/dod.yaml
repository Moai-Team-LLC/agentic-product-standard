  - n: 33
    key: oversight-program
    group: measurement
    title: Human oversight as a program
    since: "3.1.0"
    changed: "4.0.0"
    binds: Wherever a human approval counts as a control; the oversight plan at O1+
    binds_short: approval gates
    text: >-
      Human approval and review are run as a program: **override rate** and **approval
      latency** (p50/p95) are measured per queue, and a
      **rubber-stamp alarm** — near-total approval at latencies too short to have read the
      action — triggers a review; at **O1+** the Loop License declares the oversight plan
      (sampling schedule per mode, reviewer SLA, re-escalation triggers) and reviews are
      captured as stratified labeled data (Part V · *Human oversight*)
    audit:
      checks:
        - Override rate and approval latency (p50/p95) are tracked per approval queue and per reviewer
        - >-
          A rubber-stamp alarm fires on sustained near-100% approval at very low latency — and
          the queue is reviewed, not the alarm silenced
        - >-
          At O1+, the Loop License declares a sampling schedule per oversight mode, a reviewer
          SLA, and automatic re-escalation triggers (regression or override-rate spike →
          previous mode)
        - Human reviews/overrides are captured as stratified labeled data (escalations **plus** a random routine sample)
      why: >-
        oversight is an operated program, not a checkbox; graduation must be reversible on
        regression. Automation bias turns an approval gate back into no gate — IMDA's agentic
        governance framework (updated May 2026) names a low override rate as a signal of
        rubber-stamping.
      gap: >-
        "human review" that only sees escalated hard cases, skewing the review-derived golden
        data — or an approval queue so long that reviewers approve in bulk.
    crosswalk: {eu_ai_act: ["14", "26"], owasp_asi: [ASI09], nist_ai_rmf: ["GOVERN 2", "MANAGE 4"], imda: [2]}

  - n: 24
    key: gate-integrity
    group: gates
    title: No safety gate silenced to pass CI
    since: "3.2.0"
    text: >-
      No safety-class gate is disabled repo-wide to pass CI — a correctness test, type-safety
      (`no-unsafe-*` / `no-explicit-any`), security lint, or a coverage/mutation floor; a false
      positive is scoped to a file/glob with a named reason and the gate re-proven to still
      fire (Canon 5, *gate-integrity invariant*). Binds wherever such a gate exists.
    audit:
      checks:
        - >-
          No safety-class gate is disabled repo-wide to make CI green — a correctness test,
          type-safety (`no-unsafe-*` / `no-explicit-any`), security lint, or a coverage/mutation floor
        - >-
          Any false positive is scoped to a file/glob with a named reason (not a repo-wide
          `off`, blanket `@ts-ignore`/`eslint-disable`, `.skip`, or a lowered threshold)
        - After scoping, the gate is re-proven to still fire — plant the thing it must catch and confirm it's caught
      why: >-
        a gate is trust-bearing only if green means the property holds, not that the check was
        silenced; disabling it removes the exact protection at the moment it fired. `tsc`
        passing is not a substitute for the `no-unsafe-*` family — `any` is assignable to
        everything by design, so the compiler waves it through (Canon 5, *gate-integrity
        invariant*).
      gap: a flaky lint rule disabled repo-wide to unblock CI, silently blinding every file instead of the one that misfired.
    crosswalk: {eu_ai_act: ["9", "17"], nist_ai_rmf: ["GOVERN 1", "MEASURE 4"], imda: [3]}

  - n: 25
    key: graph-license
    group: composition
    title: Graph License
    since: "3.3.0"
    changed: "4.0.0"
    binds: Any graph of agents operating at O1+
    binds_short: multi-agent, O1+
    applies_if: multi_agent and oversight >= 1
    text: >-
      **Graph License** held: the six gates re-evaluated at graph scope (graph-level golden tasks, regression gate, blast radius as
      the union of node radii **plus** the shared state store, per-node **and** aggregate cost
      caps, a kill switch tested against in-flight parallel branches, one named escalation
      owner); the **weakest-link bound** holds on every path to an external action; shared
      state carries writer provenance and verification status; every fan-in is a declared
      verification point or a rationalized pass-through; every edge class is marked
      **enforced** or **declared**, and declared-only edges are not counted as controls (Part
      IV · [`CHECKLIST`](@/templates/graph-license/CHECKLIST.md))
    audit:
      checks:
        - >-
          The six gates re-evaluated at **graph** scope: graph-level golden tasks (end-to-end,
          not the union of per-node suites) · regression gate on that set · blast radius as the
          **union** of node radii **plus the shared state store** · cost caps **per-node and
          aggregate** · a kill switch tested against **in-flight parallel branches** · **one**
          named escalation owner for the graph
        - >-
          **Weakest-link bound** holds: no path to an external action runs under less
          oversight than its least-licensed node allows
        - >-
          Shared state carries **writer provenance** (producing node, timestamp, `verified_by`
          / `unverified`); consumers can filter on it; no external action fires from an
          unverified field
        - Every **fan-in** is a declared verification point or an explicit pass-through with rationale
        - Every **edge class** is marked **enforced** or **declared**; declared-only edges are not counted as controls
        - Graph eval suite includes **poisoned-state** scenarios (a hijacked or hallucinating node writing to shared state)
      why: >-
        a graph of licensed loops is not a licensed graph. The failures that hurt are exactly
        the ones no single node owns — nodes that pass in isolation failing in composition,
        fan-out multiplying spend past every per-node cap while each reads green, an
        uncalibrated node lending a path autonomy it never earned, and an escalation path that
        forks so no human is on the hook (Part IV, *License Composition*;
        [`CHECKLIST`](@/templates/graph-license/CHECKLIST.md)).
      gap: >-
        the topology is drawn in an SOP or a system prompt and then cited as a control, though
        nothing in the runtime prevents a different route (anti-pattern 18).
    crosswalk: {eu_ai_act: ["9", "14", "15"], owasp_asi: [ASI07, ASI08], nist_ai_rmf: ["MAP 4", "MANAGE 1"], imda: [1, 3]}

  - n: 28
    key: inter-agent-trust
    group: composition
    title: Inter-agent trust
    since: "4.0.0"
    binds: Wherever work is delegated across a trust boundary
    binds_short: cross-boundary
    applies_if: cross_boundary
    text: >-
      Before delegating across a trust boundary — another organization, vendor, or
      independently operated service, typically over A2A — the peer's **signed Agent Card is
      verified** (JWS over the JCS-canonicalized card, keys from a trusted keystore or an
      allow-listed `jku` origin); unsigned or unverifiable peers fail closed; the delegated
      scope never exceeds the delegator's own; the peer's output enters as untrusted input
      (Part IV · *Edges are ingestion boundaries*)
    audit:
      checks:
        - Every cross-boundary peer is listed with its expected signing keys (or trusted keystore) and the scopes it may receive
        - Agent Card signatures are verified before first use and on every card refresh; expired or revoked keys are rejected
        - A test with a forged, re-signed, or unsigned card fails closed
        - Delegated credentials are down-scoped to the task and never exceed the delegator's own
        - Peer responses are untrusted input — injection cases for the peer channel live in the eval suite
      why: >-
        A2A v1.0 lets agents sign their cards but leaves verification a SHOULD and does not
        bind the key URL to the card's origin. Inside your trust boundary an orchestrator calls
        functions; across it, an unverified card is an unauthenticated principal you are about
        to hand work — and possibly data — to.
      gap: fetching a partner's Agent Card over HTTPS and treating TLS as proof of who operates the agent.
    crosswalk: {eu_ai_act: ["15"], owasp_asi: [ASI03, ASI07], nist_ai_rmf: ["GOVERN 6", "MANAGE 3"], imda: [3]}

  - n: 31
    key: regulatory-record
    group: governance
    title: Regulatory classification record
    since: "4.0.0"
    binds: Wherever the product is exposed to a regulated jurisdiction, e.g. EU users
    binds_short: regulated
    applies_if: regulated
    text: >-
      A written record states the jurisdictions the product is exposed to and, for each
      regime, the product's **role** and **risk class** — under the EU AI Act: provider or
      deployer; prohibited, high-risk (Annex I or III), transparency (Art. 50), or minimal;
      general-purpose-model dependencies — with the application dates that bind it; the record
      has an owner and is re-reviewed whenever the intended purpose, user base, or model
      changes ([`CROSSWALK`](@/CROSSWALK.md))
    audit:
      checks:
        - Jurisdictions in scope are listed (where users are, where outputs are used)
        - >-
          The EU AI Act role (provider, deployer, or both) and risk class are recorded with the
          reasoning, including whether any Annex III use case applies
        - >-
          Art. 50 transparency duties are identified (AI-interaction disclosure,
          machine-readable marking of synthetic content) with owners and dates
        - >-
          Application dates are recorded — Art. 50 from 2 Aug 2026 (marking grace to 2 Dec 2026
          only for systems already on the market); Annex III high-risk from 2 Dec 2027; Annex I
          from 2 Aug 2028
        - A change of intended purpose, user base, or model triggers re-review — and so does each major release
        - The record lives in version control (e.g. the `regulatory` block of `aps-conformance.yaml`)
      why: >-
        the Digital Omnibus (Regulation (EU) 2026/1744, in force 27 Jul 2026) fixed the
        high-risk dates, and Art. 50 already applies. Classification is the input every other
        obligation depends on, and an agent's intended purpose drifts faster than a legal
        review cycle. The record is the engineering input to a legal assessment — not a
        substitute for one.
      gap: >-
        nobody can say whether the product is a provider or a deployer, because the
        classification lived in a slide deck from the launch review.
    crosswalk: {eu_ai_act: ["6", "26", "50"], nist_ai_rmf: ["GOVERN 1", "MAP 1", "MAP 2"], imda: [1, 4]}
