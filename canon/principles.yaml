# The six principles. `summary` feeds the README table; `statement` feeds STANDARD.md and the skills.
principles:
  - n: 1
    key: determinism
    name: Determinism by default, agency by necessity
    summary: Every degree of autonomy must be *earned*, not granted upfront.
    statement: every degree of autonomy must be earned, not granted upfront.
  - n: 2
    key: architecture
    name: Architecture beats framework
    summary: Patterns outlive libraries.
    statement: patterns outlive libraries.
  - n: 3
    key: harness
    name: Harness > model
    summary: Reliability lives in the code *around* the LLM — in Claude Code, by one community estimate, that harness is ~98% of the code.
    statement: reliability lives in the code around the LLM, not in the LLM itself; in Claude Code, by one community estimate, that harness is ~98% of the code (Canon 4).
  - n: 4
    key: context
    name: Context engineering is the core discipline
    summary: What enters the context window determines everything.
    statement: what enters the context window determines everything.
  - n: 5
    key: evals
    name: Eval-driven development is non-negotiable
    summary: No measurement → no improvement. No trace review → no understanding.
    statement: no measurement, no improvement; no trace review, no understanding.
  - n: 6
    key: security
    name: Security is a structural property, not a guardrail
    summary: Safety comes from architecture — identity, least privilege, isolation, pinned tools — not filters bolted onto the edges.
    statement: >-
      an agent's safety comes from architecture (identity, least privilege, isolation, pinned
      tool definitions), not from filters bolted onto the edges. Content filters top out near
      ~97% accuracy, so ~3% of injection attacks succeed by design — a property you mitigate
      structurally, not a number you tune.
