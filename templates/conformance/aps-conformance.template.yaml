# aps-conformance.yaml — self-assessment against The Agentic Product Standard v4.0.0-rc.1.
# Generated from canon/ by tools/aps.py — edit the canon, not this file.
#
# Copy to your product repo, fill it in with the team, and score it:
#   python3 tools/aps.py conformance aps-conformance.yaml --sarif aps.sarif
#   or: uses: Moai-Team-LLC/agentic-product-standard@v4.0.0-rc.1
#
# status: yes | no | na.  A `yes` needs `evidence` — a repo-relative path or a URL; an `na` needs a
# `reason`. Items whose condition does not hold for your profile are N/A automatically.
# Half-met is `no`. The first `no` in the lowest band is your next piece of work.
standard: "4.0.0-rc.1"

product:
  name: my-agentic-product
  owner: team@example.com
  stage: production           # prototype | production

# The operating point you run at, and what the product contains.
profile:
  autonomy: L2                # L0–L4 — who chooses the next step
  oversight: O0               # O0 in the loop · O1 on the loop · O2 unattended
  multi_tenant: false
  mcp: false                  # speaks MCP as client or server
  multi_agent: false          # more than one agent composed
  cross_boundary: false       # delegates across an org / vendor / service trust boundary (e.g. A2A)
  llm_judge: false            # uses LLM judges in evals or gates
  retrieval: false            # has a memory or retrieval component
  regulated: false            # exposed to a regulated jurisdiction (e.g. EU users)
  fleet: false                # runs a persistent fleet of scheduled agents
  multi_provider: false       # model calls fan out over several models/providers

# The protocol revisions you actually speak (DoD 26, 29).
baselines:
  mcp: "2026-07-28"
  otel_genai: ""              # the semantic-conventions-genai commit you pin

# DoD 31 — the regulatory classification record (fill in if regulated).
regulatory:
  jurisdictions: []           # e.g. [EU, US-CA, SG]
  eu_ai_act:
    role: ""                  # provider | deployer | both
    risk_class: ""            # prohibited | high-risk-annex-iii | high-risk-annex-i | transparency | minimal
    art50: []                 # e.g. [ai-interaction-disclosure, synthetic-content-marking]
    owner: ""
    reviewed: ""              # YYYY-MM-DD

items:

  # ── Architecture & contracts ──
  # (M1) The operating point is declared — autonomy level (L0–L4) and oversight mode (O0–O2) — and matches what runs in production.
  arch.operating-point: {status: no, evidence: ""}
  # (M1) The system uses the least autonomous architecture sufficient for the task.
  arch.least-autonomy: {status: no, evidence: ""}
  # (M1) Every agent has an Agent Contract; every tool a Tool Contract.
  arch.contracts: {status: no, evidence: ""}
  # (M1) Acceptance criteria are hard-to-vary: each names the single probe that falsifies it.
  arch.hard-to-vary: {status: no, evidence: ""}
  # (M2) Each climb in autonomy was earned by pass@1 ≥ 90% at the level below; each relaxation of oversight by the Loop License's pass^5 threshold.
  arch.earned-autonomy: {status: no, evidence: ""}
  # (M2, if multi-agent) Multi-agent is an orchestrator with isolated subagents — not a peer-to-peer bus.
  arch.orchestrator: {status: no, evidence: ""}

  # ── Context & state ──
  # (M1 · DoD 1) Context stays within a measured budget in a typical cycle (40% of the window until you have measured it).
  ctx.budget: {status: no, evidence: ""}
  # (M1 · DoD 2) State is externalized — not held only in the context window or in a protocol session.
  ctx.state: {status: no, evidence: ""}
  # (M2 · DoD 3) Compaction is tested on long-running scenarios; sub-agent outputs are condensed.
  ctx.compaction: {status: no, evidence: ""}

  # ── Tools & permissions ──
  # (M1) Tools are allow-listed; active count < 20 per agent (or RAG-over-tools).
  tools.allowlist: {status: no, evidence: ""}
  # (M1 · DoD 5) Tool inputs are schema-validated; permissions enforced in code, not prompt.
  tools.permissions: {status: no, evidence: ""}
  # (M1 · DoD 4) Consequential (P3+) actions require human approval — or, at O1+, stay inside the Loop License's declared blast radius; destructive (P6) actions require approval at every oversight mode.
  tools.approval: {status: no, evidence: ""}
  # (M2 · DoD 6) Tool execution is sandboxed (containers / OAuth scopes / least privilege).
  tools.sandbox: {status: no, evidence: ""}

  # ── Security & identity ──
  # (M2 · DoD 13) Lethal-trifecta check performed and documented; if all three legs present, one is broken.
  sec.trifecta: {status: no, evidence: ""}
  # (M2, if MCP · DoD 14) MCP tool definitions pinned by hash with change alerts, re-verified whenever a cached tool list expires; servers from an allow-listed registry, version-pinned + signature-checked.
  sec.mcp-pinning: {status: no, evidence: ""}
  # (M2, if MCP · DoD 26) Every MCP connection speaks revision 2026-07-28 (or carries a dated sunset); no state rides on a protocol session; no new use of Roots / Sampling / Logging; requestState is treated as untrusted input and integrity-protected wherever it influences authorization, resource access, or business logic.
  sec.mcp-baseline: {status: no, evidence: ""}
  # (M2, if MCP · DoD 26) MCP clients use pre-registration or Client ID Metadata Documents (Dynamic Client Registration only as a documented fallback), validate iss (RFC 9207), and bind stored client credentials to their issuer; servers never pass tokens through.
  sec.mcp-auth: {status: no, evidence: ""}
  # (M2, if MCP · DoD 26) The official MCP conformance suite runs in CI, at a pinned version and against what 2026-07-28 requires, for every MCP server and client you own; each baselined failure is an owned, dated gap.
  sec.mcp-conformance: {status: no, evidence: ""}
  # (M2 · DoD 27) OAuth 2.1 scoped, short-lived, audience-bound tokens; no token passthrough; no over-scoping.
  sec.tokens: {status: no, evidence: ""}
  # (M2 · DoD 27) Each agent acts under its own least-privilege non-human identity — no shared service account; identity & tenant derived from auth, never the model.
  sec.identity: {status: no, evidence: ""}
  # (M2 · DoD 27) Every action is attributable in traces to the agent identity that took it and to the human or system that delegated it.
  sec.attribution: {status: no, evidence: ""}
  # (M3) Indirect prompt injection (poisoned docs / tool output) is in the threat model and red-team tested.
  sec.indirect-injection: {status: no, evidence: ""}

  # ── Tenant isolation (if multi-tenant) ──
  # (M2, if multi-tenant · DoD 32) tenant_id derived from auth only; no-tenant requests fail closed.
  tenant.auth-derived: {status: no, evidence: ""}
  # (M2, if multi-tenant · DoD 32) Isolation enforced below the LLM (RLS / repository layer); survives prompt injection.
  tenant.below-llm: {status: no, evidence: ""}
  # (M2, if multi-tenant · DoD 32) Retrieval, memory, cache keys (including MCP private-scoped results), traces, sub-agent messages, and jobs are all tenant-scoped.
  tenant.scoped-paths: {status: no, evidence: ""}
  # (M2, if multi-tenant · DoD 32) A code-asserted cross-tenant leakage eval runs in CI.
  tenant.leakage-eval: {status: no, evidence: ""}

  # ── Cost ──
  # (M2 · DoD 15) Per-run token/cost ceiling enforced in code (circuit breaker on runaway sessions).
  cost.ceiling: {status: no, evidence: ""}
  # (M2 · DoD 15) Prompt/KV caching enabled on stable prefixes; cost-per-task tracked in traces.
  cost.caching: {status: no, evidence: ""}
  # (M2 · DoD 15) Ceilings and routing are re-derived from measured cost per task whenever the model or provider changes.
  cost.model-swap: {status: no, evidence: ""}
  # (M2, if multi-agent) For multi-agent, the task value justifies the ~15× token cost.
  cost.multi-agent: {status: no, evidence: ""}

  # ── Reliability ──
  # (M2 · DoD 7) Durable execution: pause / resume / retry survives a killed process.
  rel.durable: {status: no, evidence: ""}
  # (M1 · DoD 8) Structured outputs validated by schema; assertions on the critical path.
  rel.schema: {status: no, evidence: ""}
  # (M1 · DoD 9) Guardrails (schema, PII, jailbreak, indirect-injection, egress) on input and output.
  rel.guardrails: {status: no, evidence: ""}

  # ── Evals & observability ──
  # (M1 · DoD 10) Eval set ≥ 50 examples per top-priority failure mode; built from real traces.
  eval.set: {status: no, evidence: ""}
  # (M2, if LLM judges · DoD 11) LLM judges are binary and calibrated against human labels (TPR/TNR tracked).
  eval.judges: {status: no, evidence: ""}
  # (M2 · DoD 12) CI blocks deploy on eval regression; 100% of production runs traced.
  eval.ci-gate: {status: no, evidence: ""}
  # (M2 · DoD 29) Telemetry follows the OTel GenAI semantic conventions at a pinned revision, with invoke_agent / chat / execute_tool spans; a schema test runs on exported traces, and a migration test precedes any pin bump.
  obs.telemetry-pinned: {status: no, evidence: ""}
  # (M2 · DoD 29) Prompt and completion content is not captured in traces by default; capture is enabled by a written policy with retention and access limits.
  obs.no-content: {status: no, evidence: ""}
  # (M3) Traces capture the trajectory, not just the final answer.
  obs.trajectory: {status: no, evidence: ""}
  # (M3) Online evals run on completed production threads; failing traces feed the offline set.
  eval.online: {status: no, evidence: ""}
  # (M3) Reliability tracked with pass^k, not only pass@1.
  eval.pass-k: {status: no, evidence: ""}

  # ── Operating without per-action approval — the Loop License (if the system runs at O1 or O2 — stop conditions also at L3+) ──
  # (M2, O1+ · DoD 16) Loop License held: eval threshold (pass@1 and pass^5), regression gate, declared blast radius, cost cap, kill switch, and escalation path — all six declared, enforced in code, tested (templates/loop-license/CHECKLIST.md).
  loop.license: {status: no, evidence: ""}
  # (M2, L3+ or O1+ · DoD 17) Stop conditions declared in the Agent Contract and enforced by the runner: max iterations, token/time/spend budgets, timeout, escalation after N consecutive failures (also binds at L3+ under O0).
  loop.stop-conditions: {status: no, evidence: ""}
  # (M2, O1+ · DoD 18) Independent verification: the producing model does not grade its own work; deterministic checks first; the LLM judge is calibrated and decorrelated from the writer.
  loop.verification: {status: no, evidence: ""}
  # (M2, O1+ · DoD 18, 30) The agent cannot modify its own tests, graders, eval sets, or thresholds — they sit outside its write scope.
  loop.checks-out-of-reach: {status: no, evidence: ""}
  # (M2, O1+ · DoD 16) "Find work" treated as untrusted input — indirect-injection cases in the eval suite, instruction/data channel separation, least-privilege triggers (OWASP LLM01).
  loop.ingestion: {status: no, evidence: ""}
  # (M2, O1+ · DoD 16) Instruction supply chain governed: skills/prompts/instructions versioned, provenanced, eval-gated before deploy, regression-tested on update, trigger-collisions audited; skills validated against the Agent Skills specification and hash-locked (OWASP LLM03).
  loop.supply-chain: {status: no, evidence: ""}
  # (M2, O1+ · DoD 19) Loop economics: cost per run and cost per verified outcome tracked in traces; per-run/per-window caps declared.
  loop.economics: {status: no, evidence: ""}
  # (M2, O1+ · DoD 16) Memory model and determinism map were declared at architecture time (what is persisted, retention, provenance, replayability; which steps are deterministic vs. model-driven).
  loop.declarations: {status: no, evidence: ""}
  # (M2, O2 · DoD 30) At O2, a sample of successful runs is reviewed each release for illegitimate success; the legitimacy rate is published and gates promotion.
  loop.legitimacy: {status: no, evidence: ""}

  # ── Measurement science & oversight ──
  # (M2, if LLM judges · DoD 20) Any judge that gates O1+ operation / auto-apply / release has a current Judge Card: calibration (ECE/Brier) + anchored accuracy vs. a ground-truth sample within a recency window; an uncalibrated/stale judge gates nothing.
  meas.judge-card: {status: no, evidence: ""}
  # (M2, if LLM judges · DoD 20) Gating confidence uses validated self-consistency or swap-consistency — not raw verbalized confidence; pairwise judging randomizes order or applies a swap-consistency check.
  meas.confidence: {status: no, evidence: ""}
  # (M2, if memory/retrieval · DoD 21) Retrieval / memory evaluated with Recall@k + MRR on a labeled set, separately from end-to-end evals; embedding/chunking/index changes pass a retrieval regression gate.
  meas.retrieval: {status: no, evidence: ""}
  # (M2 · DoD 22) Golden sets declare labeling provenance (rubric version, labeler, date, agreement); unanchored sets back no license or gate; rubrics are versioned with judge re-baselining on change.
  meas.provenance: {status: no, evidence: ""}
  # (M2, if LLM judges · DoD 22) Inter-judge agreement monitored; sustained near-perfect agreement triggers a decorrelation review, sustained low agreement a rubric review.
  meas.inter-judge: {status: no, evidence: ""}
  # (M2 · DoD 23) Input and behavior drift monitored vs. the eval distribution with a declared refresh policy (behavior drift at autonomy ≥ L2).
  meas.drift: {status: no, evidence: ""}
  # (M3) Provider-hosted models are canaried on a cadence; a detected silent change triggers the eval regression gate before continued reliance.
  meas.canary: {status: no, evidence: ""}
  # (M2 · DoD 33) Wherever a human approval counts as a control, override rate and approval latency (p50/p95) are tracked per queue, and a rubber-stamp alarm triggers a review.
  meas.automation-bias: {status: no, evidence: ""}
  # (M2, O1+ · DoD 33) Human-oversight program: sampling schedule per oversight mode with automatic re-escalation on regression; reviews captured as stratified labeled data.
  meas.oversight-plan: {status: no, evidence: ""}

  # ── Composition (multi-agent) (if more than one agent is composed) ──
  # (M2, multi-agent, O1+ · DoD 25) Graph License held: the six gates at graph scope, the weakest-link bound on every action path, shared-state provenance, fan-in verification points, and every edge class marked enforced or declared (templates/graph-license/CHECKLIST.md).
  graph.license: {status: no, evidence: ""}
  # (M2, multi-agent, O1+ · DoD 25) The graph eval suite includes poisoned-state scenarios — a hijacked or hallucinating node writing to shared state — and downstream nodes do not act on it.
  graph.poisoned-state: {status: no, evidence: ""}
  # (M2, if delegating across a trust boundary · DoD 28) Before delegating across a trust boundary, the peer's signed Agent Card is verified (JWS over the JCS-canonicalized card; keys from a trusted keystore or an allow-listed jku); a forged or unsigned card fails closed; delegated scope never exceeds the delegator's.
  graph.inter-agent-trust: {status: no, evidence: ""}

  # ── Governance & regulation ──
  # (M1, if regulated · DoD 31) A regulatory classification record exists — jurisdictions, role and risk class under each regime (EU AI Act — provider/deployer, Annex I/III, Art. 50), application dates — with an owner and a re-review trigger on any change of purpose, users, or model.
  gov.classification: {status: no, evidence: ""}

  # ── Fleet operations (if running a persistent fleet) ──
  # (M2, if running a fleet) Each deployed agent is a versioned runtime manifest (resources, schedule, runtime + model, env interpolation), distinct from its Agent Contract; the same manifest runs in dev and prod, with agent-logic split from the platform prompt injected at run time.
  fleet.manifest: {status: no, evidence: ""}
  # (M2, if running a fleet) Scheduled / triggered runs are coordinated by a lock (fire-once across replicas); missed runs (misfires) are detected and handled, not silently dropped.
  fleet.scheduling: {status: no, evidence: ""}
  # (M2, if running a fleet) Overflow work queues in a durable backlog that survives a restart — no in-memory-only work queue.
  fleet.backlog: {status: no, evidence: ""}
  # (M2, if running a fleet) Per-agent isolation + resource limits; runs terminate gracefully (drain, then SIGINT→SIGKILL); deploy / start / stop / restart are operations, not full redeploys.
  fleet.lifecycle: {status: no, evidence: ""}
  # (M3, if running a fleet) Fleet observability: per-agent health/heartbeat + topology, plus an append-only operational audit (lifecycle / auth / tool-call events), on top of the per-run traces above.
  fleet.observability: {status: no, evidence: ""}
  # (M3, if running a fleet) Inter-agent calls follow an explicit "who-may-call-whom" matrix (default deny); coordination prefers an event bus over hard-wired calls.
  fleet.call-matrix: {status: no, evidence: ""}

  # ── Model & provider (if calls fan out over multiple models/providers) ──
  # (M2, if multi-provider) All model calls go through one provider-abstraction point; adding a provider is config, not code.
  model.abstraction: {status: no, evidence: ""}
  # (M2, if multi-provider) Model selection per task class is sourced from measured eval results, and the source eval run is recorded.
  model.eval-sourced: {status: no, evidence: ""}
  # (M2, if multi-provider) Clients hold exactly one credential; upstream provider keys are vaulted and never reach clients or logs.
  model.one-credential: {status: no, evidence: ""}
  # (M3, multi-provider, multi-tenant) Tenant-scoped budgets, cache, and routing with a cross-tenant leakage test in CI.
  model.tenant-scoped: {status: no, evidence: ""}

  # ── Maintenance discipline ──
  # (M1 · DoD 24) No safety-class gate is disabled repo-wide to pass CI (correctness test, type-safety / no-unsafe- / no-explicit-any, security lint, coverage/mutation floor); false positives are scoped to a file/glob with a named reason, and the gate is re-proven to still fire (Canon 5, gate-integrity invariant).
  maint.gate-integrity: {status: no, evidence: ""}
  # (M2) Every forbidden action has a code-asserted anti-criterion (not prose alone).
  maint.anti-criteria: {status: no, evidence: ""}
  # (M3) Rules are tagged anti-fragile vs. fragile; fragile scaffolding is re-tested each model upgrade (bitter-pill).
  maint.bitter-pill: {status: no, evidence: ""}
