# Standalone copy for after a split (git subtree split --prefix=aitm-smb).
# Inert while AITM-SMB lives inside the Agentic Product Standard repository:
# GitHub reads issue forms only from the host's .github/ISSUE_TEMPLATE/.

name: "Method change proposal"
description: Propose a change to what AITM-SMB requires, defines, or produces.
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Semantic changes start here, before a pull request (CONTRIBUTING.md). Keep one topic per proposal. Illustrate with abstract scenarios (validation/ABSTRACT_SCENARIOS.md) or fictional cases; name no real company, client, or vendor.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What goes wrong today, for whom, and in which files? Show where the current method fails, misleads, or cannot be followed.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should change, and in which canonical source (CANONICAL_CONCEPTS.md names it)? Other files should reference that source rather than copy it.
    validations:
      required: true
  - type: dropdown
    id: versioning
    attributes:
      label: VERSIONING.md class
      description: PATCH = clarification or correction; MINOR = compatible addition; MAJOR = incompatible change (requires 2.0).
      options:
        - PATCH
        - MINOR
        - MAJOR
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: public_api
    attributes:
      label: PUBLIC_API.md impact
      description: Does the change touch a stable item in PUBLIC_API.md §1–§8 (objects, identifiers, core trace, profiles, intervention families, autonomy levels, agent statuses)?
      options:
        - None
        - Compatible addition
        - Incompatible change (requires 2.0)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Why is the change needed? Link a reproducible problem, a scenario walk-through, a primary source, or engagement experience described without identifying anyone.
    validations:
      required: true
  - type: textarea
    id: proportionality
    attributes:
      label: Proportionality
      description: Which decision does this improve, which risk does it control, or which evidence does it produce (INV-15, APPLICATION_PROFILES.md §9)? What would it cost practitioners?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Simpler options, including leaving the method unchanged.
    validations:
      required: false
