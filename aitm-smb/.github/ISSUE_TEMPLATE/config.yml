# Standalone copy for after a split (git subtree split --prefix=aitm-smb).
# While AITM-SMB lives inside the Agentic Product Standard repository, GitHub
# reads issue templates only from the host's .github/, so this file is inert.
# On a split, update the URLs below to the new repository (MAINTENANCE.md §6).

blank_issues_enabled: true
contact_links:
  - name: Read the standard
    url: https://github.com/Moai-Team-LLC/agentic-product-standard/blob/main/aitm-smb/STANDARD.md
    about: The rules of AITM-SMB. Check here, and in the file you want to change, before opening an issue.
  - name: Run a first engagement
    url: https://github.com/Moai-Team-LLC/agentic-product-standard/blob/main/aitm-smb/QUICKSTART.md
    about: Questions about applying the method usually start here.
  - name: Report a security or agent-safety problem
    url: https://github.com/Moai-Team-LLC/agentic-product-standard/security/advisories/new
    about: Private report. Do not open a public issue (see SECURITY.md).
