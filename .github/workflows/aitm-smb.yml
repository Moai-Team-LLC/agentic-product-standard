name: aitm-smb

# CI and releases for the AITM-SMB methodology in aitm-smb/. The folder is
# split-ready (git subtree split --prefix=aitm-smb); aitm-smb/.github/ carries
# the equivalent standalone workflow for after a split. Every command runs
# from inside aitm-smb/ so it is identical in both places.
#
# Release: push a tag aitm-smb-vX.Y.Z matching aitm-smb/MANIFEST.md. The
# release notes are the matching aitm-smb/CHANGELOG.md section; the Core and
# Full distributions are attached. Path filters do not apply to tag pushes.
# --latest=false keeps the host standard's own release marked Latest.
#
# The distributions are built once, in the validate job, and the Full one is
# unpacked and validated on its own before the release job publishes that same
# build. Nothing is written inside aitm-smb/ before the build, so the archives
# hold the tagged tree and nothing else.
#
# Run the workflow manually with an existing tag to rebuild that release's
# distributions from the tagged tree and replace its assets (or create the
# release if its first run failed). It never creates or moves a tag.

on:
  push:
    branches: [main]
    paths: ["aitm-smb/**", ".github/workflows/aitm-smb.yml"]
    tags: ["aitm-smb-v*"]
  pull_request:
    paths: ["aitm-smb/**", ".github/workflows/aitm-smb.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing aitm-smb-vX.Y.Z tag whose release assets to rebuild"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Integrity, worked example, distributions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aitm-smb
    steps:
      - uses: actions/checkout@v4
        with:
          # empty outside workflow_dispatch: the event's own commit
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}

      - name: Framework integrity
        run: python3 tools/validate.py

      - name: Worked example trace integrity
        run: python3 tools/validate.py --engagement examples/compact-scenario-b

      - name: Build Core and Full distributions
        run: python3 tools/build_dist.py

      - name: Full distribution validates on its own
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import sys; sys.path.insert(0, "tools"); from validate import manifest; print(manifest()["version"])')
          DEST="$RUNNER_TEMP/full"
          rm -rf "$DEST"
          python3 -m zipfile -e "dist/aitm-smb-full-$VERSION.zip" "$DEST"
          cd "$DEST/aitm-smb-$VERSION"
          python3 tools/validate.py
          python3 tools/validate.py --engagement examples/compact-scenario-b

      - uses: actions/upload-artifact@v4
        with:
          name: aitm-smb-dist
          path: aitm-smb/dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: validate
    if: startsWith(github.ref, 'refs/tags/aitm-smb-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: aitm-smb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}

      - name: Check the tag matches MANIFEST.md
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^aitm-smb-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$TAG is not an aitm-smb-vX.Y.Z tag"
            exit 1
          fi
          VERSION="${TAG#aitm-smb-v}"
          MANIFEST_VERSION=$(python3 -c 'import sys; sys.path.insert(0, "tools"); from validate import manifest; print(manifest()["version"])')
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::tag $TAG does not match MANIFEST.md version $MANIFEST_VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: aitm-smb-dist
          path: aitm-smb/dist

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/notes.md"
          awk -v v="$VERSION" '
            $0 ~ ("^## \\[" v "\\]") { f=1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > "$NOTES"
          # Relative links do not resolve on the Release page; point them at the tagged tree.
          BASE="https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/aitm-smb/"
          sed -E -i "s#\]\((\.?/)?([^):\#][^):]*)\)#](${BASE}\2)#g" "$NOTES"
          if [ ! -s "$NOTES" ]; then
            echo "::error::no CHANGELOG.md section for $VERSION"
            exit 1
          fi

      - name: Create the release, or replace its assets
        run: |
          set -euo pipefail
          assets=(dist/aitm-smb-core-"$VERSION".zip dist/aitm-smb-full-"$VERSION".zip)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "AITM-SMB $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --latest=false \
              "${assets[@]}"
          fi
