name: release

# On a version tag, publish a GitHub Release whose notes are the matching
# CHANGELOG.md section. This is the project's automatic "news of an update":
# it lands on the Releases page, notifies watchers, and feeds /releases.atom.
# Push a tag to trigger it, e.g.:  git tag v2.0.0 && git push origin v2.0.0
# Release candidates (v4.0.0-rc.1) publish as GitHub pre-releases.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]

permissions:
  contents: write   # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the canon version
        run: |
          set -euo pipefail
          # quoted or bare, `version: "4.0.0"` and `version: 4.0.0` both read as 4.0.0
          canon="$(python3 - <<'PY'
          import re
          text = open("canon/meta.yaml", encoding="utf-8").read()
          m = re.search(r"""^version:[ \t]*["']?([^"'\s#]+)""", text, re.M)
          print(m.group(1) if m else "")
          PY
          )"
          if [ "v$canon" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match canon/meta.yaml version $canon"; exit 1
          fi

      - name: Extract this version's CHANGELOG section
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Print the body between "## [VERSION]" and the next "## [" heading.
          awk -v v="$VERSION" '
            $0 ~ ("^## \\[" v "\\]") { f=1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "no CHANGELOG section for $VERSION; falling back to auto-generated notes" >&2
            echo "FALLBACK=1" >> "$GITHUB_ENV"
          fi

      - name: Create the GitHub Release
        run: |
          set -euo pipefail
          pre=()
          case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
          if [ "${FALLBACK:-0}" = "1" ]; then
            gh release create "$GITHUB_REF_NAME" "${pre[@]}" \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" "${pre[@]}" \
              --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
